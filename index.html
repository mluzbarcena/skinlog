<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
  <meta name="theme-color" content="#f5f7f6" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f1518" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="Seguimiento diario personal de rutina de skincare y progresión de retinol." />
  <title>Rutina · Skincare</title>

  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Rutina" />

  <script>
    // Anti-flash: apply the dark theme before React mounts, reading the persisted
    // setting (theme: auto|light|dark). "auto" follows the OS.
    (function () {
      try {
        var raw = localStorage.getItem("skincareTracker:v1");
        var theme = raw ? (JSON.parse(raw).settings || {}).theme || "auto" : "auto";
        var dark = theme === "dark" || (theme === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) { /* ignore */ }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
